<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PyCoin Explorer{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #0d1117; }
    .navbar-brand { font-weight: 700; letter-spacing: 1px; color: #f7931a !important; }
    .coin-badge { background: #f7931a; color: #000; font-weight: 700; border-radius: 4px; padding: 2px 8px; font-size: .75rem; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; }
    .hash { font-family: monospace; font-size: .85em; word-break: break-all; color: #58a6ff; }
    .table { --bs-table-bg: transparent; }
    .table thead th { border-color: #30363d; color: #8b949e; font-size: .8rem; text-transform: uppercase; }
    .table td { border-color: #21262d; vertical-align: middle; }
    a.hash:hover { text-decoration: underline; }
    .block-num { background: #161b22; border: 1px solid #30363d; border-radius: 4px; padding: 2px 8px; font-family: monospace; }
    footer { border-top: 1px solid #21262d; margin-top: 3rem; padding: 1.5rem 0; color: #8b949e; font-size: .85rem; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#161b22;border-bottom:1px solid #30363d;">
  <div class="container">
    <a class="navbar-brand" href="/">⛏ PyCoin</a>
    <span class="coin-badge ms-2">PYC</span>
    <div class="ms-auto d-flex gap-3 align-items-center">
      <a class="nav-link text-secondary" href="/">Explorer</a>
      <a class="nav-link text-secondary" href="/wallet">Wallet</a>
      <a class="nav-link text-secondary" href="/docs">API Docs</a>
    </div>
    <form class="d-flex ms-3" action="/search" method="get">
      <input class="form-control form-control-sm" style="background:#0d1117;border-color:#30363d;color:#cdd9e5;width:320px;"
             name="q" placeholder="Search block hash, tx id, or address…">
      <button class="btn btn-sm btn-outline-secondary ms-1" type="submit">Go</button>
    </form>
  </div>
</nav>

<div class="container py-4">
  {% block content %}{% endblock %}
</div>

<footer class="text-center">
  PyCoin &bull; Open-source proof-of-work cryptocurrency &bull; 21M supply cap
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
