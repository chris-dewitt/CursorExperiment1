<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Enigma Explorer{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root {
      --enigma-purple: #7c3aed;
      --enigma-cyan: #06b6d4;
      --enigma-violet: #a855f7;
      --enigma-bg: #0a0a0f;
      --enigma-card: #12121a;
      --enigma-border: #2a2a3d;
    }
    body {
      background: radial-gradient(ellipse at top, #151525 0%, var(--enigma-bg) 60%);
      min-height: 100vh;
    }
    .navbar-brand {
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, var(--enigma-cyan), var(--enigma-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .coin-badge {
      background: linear-gradient(135deg, var(--enigma-purple), var(--enigma-cyan));
      color: #fff;
      font-weight: 700;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: .75rem;
      letter-spacing: 1px;
    }
    .stat-card {
      background: var(--enigma-card);
      border: 1px solid var(--enigma-border);
      border-radius: 10px;
      transition: border-color .2s;
    }
    .stat-card:hover { border-color: var(--enigma-purple); }
    .compute-card {
      background: linear-gradient(135deg, rgba(124,58,237,.12), rgba(6,182,212,.08));
      border: 1px solid rgba(124,58,237,.35);
    }
    .hash { font-family: monospace; font-size: .85em; word-break: break-all; color: var(--enigma-cyan); }
    .table { --bs-table-bg: transparent; }
    .table thead th { border-color: var(--enigma-border); color: #8b949e; font-size: .8rem; text-transform: uppercase; }
    .table td { border-color: #1a1a28; vertical-align: middle; }
    a.hash:hover { color: var(--enigma-violet); }
    .block-num { background: var(--enigma-card); border: 1px solid var(--enigma-border); border-radius: 4px; padding: 2px 8px; font-family: monospace; }
    .status-surplus { color: #34d399; }
    .status-balanced { color: var(--enigma-cyan); }
    .status-constrained { color: #f472b6; }
    footer { border-top: 1px solid var(--enigma-border); margin-top: 3rem; padding: 1.5rem 0; color: #8b949e; font-size: .85rem; }
    .btn-enigma {
      background: linear-gradient(135deg, var(--enigma-purple), var(--enigma-cyan));
      border: none;
      color: #fff;
      font-weight: 600;
    }
    .btn-enigma:hover { opacity: .9; color: #fff; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#12121a;border-bottom:1px solid var(--enigma-border);">
  <div class="container">
    <a class="navbar-brand" href="/">◈ ENIGMA</a>
    <span class="coin-badge ms-2">ENIG</span>
    <div class="ms-auto d-flex gap-3 align-items-center">
      <a class="nav-link text-secondary" href="/">Explorer</a>
      <a class="nav-link text-secondary" href="/compute">Compute</a>
      <a class="nav-link text-secondary" href="/wallet">Wallet</a>
      <a class="nav-link text-secondary" href="/docs">API</a>
    </div>
    <form class="d-flex ms-3" action="/search" method="get">
      <input class="form-control form-control-sm" style="background:var(--enigma-bg);border-color:var(--enigma-border);color:#cdd9e5;width:320px;"
             name="q" placeholder="Search block hash, tx id, or address…">
      <button class="btn btn-sm btn-outline-secondary ms-1" type="submit">Go</button>
    </form>
  </div>
</nav>

<div class="container py-4">
  {% block content %}{% endblock %}
</div>

<footer class="text-center">
  Enigma &bull; Quantum-ready compute currency &bull; Supply meets demand &bull; 21M ENIG cap
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
